<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawk-Eye | Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap');

                :root {
            /* ── Background ── */
            --bg:          #080d18;
            --bg-dark:     #080d18;
            --surface:     #0d1221;
            --surface2:    #111827;
            --surface-color:     #0d1221;
            --surface-highlight: #111827;

            /* ── Borders ── */
            --border:       rgba(255,255,255,0.07);
            --border-color: rgba(255,255,255,0.07);

            /* ── Text ── */
            --text:          #f0f4ff;
            --text-primary:  #f0f4ff;
            --muted:         #a0aec8;
            --text-secondary:#a0aec8;

            /* ── Primary accent (Electric Cyan) ── */
            --accent:        #00d4ff;
            --accent-purple: #7c3aed;
            --magenta:       #00d4ff;

            /* ── Status ── */
            --green:   #00e87a;
            --yellow:  #f59e0b;
            --orange:  #fb923c;
            --red:     #ff4040;
            --blue:    #3b82f6;

            /* ── Sidebar ── */
            --sidebar-bg: #040a16;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e1b2e 0%, #0f1115 100%);
        }

        .login-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .sub-heading {
            font-size: 0.75rem;
            color: var(--magenta);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px 12px 12px 40px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    
        
        
        
        
        
        
        
        
        .help-dropdown-content::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 25px;
            background: transparent;
        }

        /* Float Theme Toggle */
        .theme-toggle-floating {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

                body.light-theme {
            --bg:          #e8edf6;
            --bg-dark:     #e8edf6;
            --surface:     #ffffff;
            --surface2:    #f5f8ff;
            --surface-color:     #ffffff;
            --surface-highlight: #f5f8ff;

            --border:       rgba(0,0,0,0.08);
            --border-color: rgba(0,0,0,0.08);

            --text:          #0a0f1e;
            --text-primary:  #0a0f1e;
            --muted:         #4a5568;
            --text-secondary:#4a5568;

            --accent:        #0095c8;
            --accent-purple: #6d28d9;
            --magenta:       #0095c8;

            --sidebar-bg: #0a1e3d;
        }
        body.light-theme {
            background: radial-gradient(circle at center, #f1f5f9 0%, #e2e8f0 100%);
        }
    </style>
    <script src="/scripts/hawk-ui.js"></script>
    <script>(function(){var t=localStorage.getItem('hawk_theme')||'dark';if(t==='light'){document.documentElement.classList.add('light-theme');}})();</script>
    <link id="hawk-theme-css-link" rel="stylesheet" href="/scripts/hawk-theme.css">
</head>

<body>
    <div class="theme-toggle-floating">
        <button id="theme-toggle-btn" class="theme-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="brand-section">
            <div class="brand-logo">🦅</div>
            <span class="brand-name">Hawk-Eye</span>
            <span class="sub-heading">T-Systems</span>
        </div>

        <div id="errorMessage" class="error-message">Invalid username or password</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" class="input-field" placeholder="Enter username" required
                        autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" class="input-field" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="footer-text">
            Default credentials: <span style="color: var(--text-primary)">admin / admin</span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMessage');

            if (user === 'admin' && pass === 'admin') {
                // Save both auth and username
                document.cookie = "hawk_session=authenticated; path=/; max-age=3600";
                document.cookie = "hawk_user=" + encodeURIComponent(user) + "; path=/; max-age=3600";
                window.location.href = "/dashboard";
            } else {
                error.style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>

</html>
