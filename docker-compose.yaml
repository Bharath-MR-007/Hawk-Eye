services:
  hawkeye:
    build: .
    container_name: hawkeye
    network_mode: host
    # ports:
    #   - "8080:8080"
    volumes:
      - ./dashboard.html:/dashboard.html:z
      - ./live_dashboard_backup.html:/live_dashboard_backup.html:z
      - ./checks.yaml:/checks.yaml:z
      - ./live_dashboard.html:/live_dashboard.html:z
      - ./inventory.html:/inventory.html:z
      - ./alerts_config.html:/alerts_config.html:z
      - ./polling_config.html:/polling_config.html:z
      - ./incidents.html:/incidents.html:z
      - ./incident_drilldown.html:/incident_drilldown.html:z
      - ./integrations.html:/integrations.html:z
      - ./integrations_config.html:/integrations_config.html:z
      - ./integrations_guide.html:/integrations_guide.html:z
      - ./snmp_config.yaml:/snmp_config.yaml:z
      - ./login.html:/login.html:z
      - ./installation.html:/installation.html:z
      - ./requirements.html:/requirements.html:z
      - ./capabilities.html:/capabilities.html:z
      - ./usermanual.html:/usermanual.html:z
      - ./admindoc.html:/admindoc.html:z
      - ./about.html:/about.html:z
      - ./architecture.html:/architecture.html:z
      - ./prometheus_rules.yaml:/prometheus_rules.yaml:z
      - ./prometheus.yaml:/prometheus.yaml:z
      - ./grafana:/grafana:z
      - ./alertmanager:/alertmanager:z
      - ./chart:/chart:z
      - ./scripts:/scripts:z
      - ./troubleshooting.html:/troubleshooting.html:z
      - ./device_reachability.html:/device_reachability.html:z
      - ./users_config.html:/users_config.html:z
      - ./target_detail.html:/target_detail.html:z
      - ./endpoints.html:/endpoints.html:z
      - ./endpoints_registry.json:/endpoints_registry.json:z
      - ./prometheus_sd_endpoints.yml:/prometheus_sd_endpoints.yml:z
    command: ["run", "--hawkeyeName", "hawkeye.local", "--loaderType", "file", "--loaderFilePath", "/checks.yaml", "--loaderInterval", "10s"]
    environment:
      - HAWKEYE_ENV=production
      - LOG_LEVEL=info
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # networks:
    #   - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:z
      - ./prometheus_rules.yaml:/etc/prometheus/prometheus_rules.yaml:z
      - ./prometheus_sd_endpoints.yml:/prometheus_sd_endpoints.yml:z
      - prometheus_data:/prometheus:z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:z
      - ./grafana/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:z
      - ./grafana/dashboards/enhanced_dashboard.json:/etc/grafana/provisioning/dashboards/hawkeye_dashboard.json:z
      - ./grafana/dashboards/site_drilldown.json:/etc/grafana/provisioning/dashboards/site_drilldown.json:z
      - grafana_data:/var/lib/grafana:z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:z
      - alertmanager_data:/alertmanager:z
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    restart: unless-stopped

  thanos-sidecar:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-sidecar
    command:
      - 'sidecar'
      - '--tsdb.path=/prometheus'
      - '--prometheus.url=http://prometheus:9090'
      - '--grpc-address=0.0.0.0:10901'
      - '--http-address=0.0.0.0:10902'
    volumes:
      - prometheus_data:/prometheus:z
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  thanos-query:
    image: thanosio/thanos:v0.36.1
    container_name: thanos-query
    command:
      - 'query'
      - '--http-address=0.0.0.0:10904'
      - '--store=thanos-sidecar:10901'
    ports:
      - "10904:10904"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - thanos-sidecar

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elastic_data:/usr/share/elasticsearch/data:z
    ports:
      - "9200:9200"
    networks:
      - monitoring
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - elasticsearch

  ai-assistant:
    build: ./observability_ai_assistant
    container_name: ai-assistant
    ports:
      - "8000:8000"
    command: ["python", "web_api.py"]
    environment:
      - HAWKEYE_URL=http://hawkeye:8080
      - PROMETHEUS_URL=http://prometheus:9090
      - ALERTMANAGER_URL=http://alertmanager:9093
      - GRAFANA_URL=http://grafana:3000
      - THANOS_QUERY_URL=http://thanos-query:10904
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=deepseek-coder:latest
      - AVAILABLE_MODELS=deepseek-coder:latest,gemma4:latest,qwen2.5:14b
      - NVIDIA_API_KEY=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
      - NVIDIA_MODEL=deepseek-ai/deepseek-v3.2
      - NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1:z
    networks:
      - monitoring
    restart: always

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  elastic_data:
